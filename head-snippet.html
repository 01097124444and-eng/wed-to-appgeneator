<!--
  حطّ الأسطر دي جوه <head> بتاعة كل صفحة HTML في موقعك (مش بس الصفحة الرئيسية)
  وتأكد إن مجلد icons/ وملف manifest.json مرفوعين على نفس المسار الجذري للموقع.
-->

<!-- الربط بملف الـ Manifest (ملف واحد بس، مش لكل جهاز) -->
<link rel="manifest" href="/manifest.json">

<!-- لون شريط المتصفح على الموبايل -->
<meta name="theme-color" content="#ffffff">

<!-- دعم iOS/Safari (مبيقرأش manifest.json فيه icons، فلازم تتكرر هنا يدوي) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="01097124444and-eng.github">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<!-- Favicons لشريط تبويبات المتصفح على الكمبيوتر -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="shortcut icon" href="/icons/favicon.ico">
